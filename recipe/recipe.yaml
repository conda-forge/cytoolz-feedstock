schema_version: 1

context:
  name: cytoolz
  version: "1.2.0"
  # cytoolz tests compare against toolz (e.g. docstrings), so test with the
  # toolz release that this cytoolz release matches
  toolz_version: ${{ (version | split("."))[:2] | join(".") }}

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/cytoolz/cytoolz-${{ version }}.tar.gz
  sha256: fdd8ded8a93e1be009577fccddaacf78aa21cbe7dc6ec53c229def0198a1ffa5

build:
  number: 0
  # setup.py cythonizes all *.pyx files and errors if Cython is missing
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - cython >=3.1
    - ${{ compiler("c") }}
    - ${{ stdlib("c") }}
  host:
    # Cython 3.1+ marks the extension modules as free-threading compatible
    - cython >=3.1
    - pip
    - python
    - setuptools >=77
    - setuptools-git-versioning >=2.0
  run:
    - python
    - toolz >=0.10.0

tests:
  - python:
      imports:
        - cytoolz
        - cytoolz.curried
      pip_check: true
  - requirements:
      run:
        - pytest
        - toolz ${{ toolz_version }}.*
    script:
      - pytest -v --doctest-modules --pyargs cytoolz
      - python -c "import cytoolz; assert cytoolz.__version__ == '${{ version }}', cytoolz.__version__"
      # On free-threaded Python, importing cytoolz must not re-enable the GIL
      - python -c "import sys, sysconfig, cytoolz; assert not (sysconfig.get_config_var('Py_GIL_DISABLED') and sys._is_gil_enabled())"
  - package_contents:
      # .pxd files let other Cython projects `cimport cytoolz`
      files:
        - "**/site-packages/cytoolz/__init__.pxd"
        - "**/site-packages/cytoolz/functoolz.pxd"

about:
  homepage: https://github.com/pytoolz/cytoolz
  repository: https://github.com/pytoolz/cytoolz
  documentation: https://toolz.readthedocs.io
  license: BSD-3-Clause
  license_file: LICENSE.txt
  summary: Cython implementation of Toolz. High performance functional utilities
  description: |
    CyToolz is the Cython implementation of the toolz package, which provides
    high performance utility functions for iterables, functions, and
    dictionaries.

extra:
  recipe-maintainers:
    - hendrikmakait
    - jrbourbeau
    - eriknw
    - mrocklin
    - jcrist
    - jakirkham
    - zklaus
