{% set name = "cytoolz" %}
{% set version = "1.2.0" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/cytoolz-{{ version }}.tar.gz
  sha256: fdd8ded8a93e1be009577fccddaacf78aa21cbe7dc6ec53c229def0198a1ffa5

build:
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --ignore-installed --no-cache-dir -vvv --config-settings="--build-option=--with-cython"

requirements:
  build:
    - python                                 # [build_platform != target_platform]
    - cross-python_{{ target_platform }}     # [build_platform != target_platform]
    - cython                                 # [build_platform != target_platform]
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
  host:
    - cython
    - pip
    - setuptools >=77
    - setuptools-git-versioning >=2.0
    - python
  run:
    - python
    - toolz >=0.10.0

test:
  imports:
    - cytoolz
    - cytoolz.curried
  commands:
    - pip check
    - pytest -v --doctest-modules --pyargs cytoolz  # [py<315]
    # cytoolz reads its signature table from toolz, which has no entry for the
    # frozendict builtin added in 3.15. Fixed in toolz master (pytoolz/toolz#624);
    # drop the deselect once toolz >1.1.0 is available.
    - pytest -v --doctest-modules --pyargs cytoolz -k "not test_introspect_builtin_modules"  # [py>=315]
    - 'python -c "import cytoolz; assert cytoolz.__version__ != ''0.0.0''"'
  requires:
    - pip
    - pytest
    - toolz ={{ ".".join(version.split(".")[:2]) }}

about:
  home: https://github.com/pytoolz/cytoolz
  license: BSD-3-Clause
  license_file: LICENSE.txt
  summary: Cython implementation of Toolz. High performance functional utilities
  description: |
    CyToolz is the Cython implementation of the toolz package, which provides
    high performance utility functions for iterables, functions, and
    dictionaries.
  doc_url: https://pypi.python.org/pypi/cytoolz
  doc_source_url: https://github.com/pytoolz/cytoolz/blob/master/README.rst
  dev_url: https://github.com/pytoolz/cytoolz

extra:
  recipe-maintainers:
    - hendrikmakait
    - jrbourbeau
    - eriknw
    - mrocklin
    - jcrist
    - jakirkham
    - zklaus
